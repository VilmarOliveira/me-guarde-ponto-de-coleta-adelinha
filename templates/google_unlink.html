{% extends 'base.html' %}{% block content %}<section class="panel-card"><h1>Desvincular conta Google</h1><p>O cadastro e todo o histórico serão preservados. Confirme sua senha para verificar que você conseguirá entrar sem o Google. Um novo vínculo exigirá sua confirmação explícita.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Senha atual<input type="password" name="password" autocomplete="current-password" required></label><label class="plan-consent"><input type="checkbox" name="confirm" value="yes" required><span>Confirmo que quero desvincular minha conta Google.</span></label><div class="actions"><button class="button primary" data-ui-icon="google-unlink">Desvincular conta Google</button><a class="button ghost" href="{{ url_for('client_area',aba='dados') }}">Cancelar</a></div></form></section>{% endblock %}
